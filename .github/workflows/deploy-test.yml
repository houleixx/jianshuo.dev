name: deploy-test

on:
  push:
    branches: [test]
    paths:
      - 'voicedrop/**'
      - 'a/**'
      - 'functions/**'
      - 'mcp/**'
      - '_headers'
      - '_redirects'
      - 'wrangler.test.jsonc'
      - 'agent/**'
      - 'reco/**'
      - 'infra/voicedrop-gateway/**'
      - '.github/workflows/deploy-test.yml'
  workflow_dispatch:

concurrency:
  group: voicedrop-test-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            reco/package-lock.json
      - name: Test Agent Worker
        working-directory: agent
        run: npm ci && npm test
      - name: Test Reco Worker
        working-directory: reco
        run: npm ci && npm test

  deploy:
    needs: test-workers
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_TEST_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply test D1 migrations
        run: |
          npx -y wrangler@4 d1 migrations apply voicedrop-usage-test --remote --config agent/wrangler.test.jsonc
          npx -y wrangler@4 d1 migrations apply voicedrop-core-test --remote --config agent/wrangler.test.jsonc
          npx -y wrangler@4 d1 migrations apply voicedrop-reco-test --remote --config reco/wrangler.test.jsonc
      - name: Deploy test Pages and Files API
        run: |
          cp wrangler.test.jsonc wrangler.jsonc
          npx -y wrangler@4 pages deploy . --project-name voicedrop-test --branch main --commit-dirty=true
      - name: Install Agent deployment dependencies
        working-directory: agent
        run: npm ci
      - name: Deploy test Agent Worker
        working-directory: agent
        run: npx -y wrangler@4 deploy --config wrangler.test.jsonc
      - name: Install Reco deployment dependencies
        working-directory: reco
        run: npm ci
      - name: Deploy test Reco Worker
        working-directory: reco
        run: npx -y wrangler@4 deploy --config wrangler.test.jsonc
      - name: Deploy unified test gateway
        # The domain is provisioned using an account with zone route permissions.
        # Keep that binding; the CI token only needs to update the Worker itself.
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = 'infra/voicedrop-gateway';
          const config = JSON.parse(fs.readFileSync(`${dir}/wrangler.test.jsonc`, 'utf8'));
          delete config.routes;
          fs.writeFileSync(`${dir}/.wrangler-ci.json`, JSON.stringify(config));
          NODE
          npx -y wrangler@4 deploy --config infra/voicedrop-gateway/.wrangler-ci.json
